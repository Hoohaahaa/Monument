name: Android camera passthrough build

on:
  push:
    branches:
      - feature/android-arcore-geospatial-bridge
    paths:
      - "android/**"
      - ".github/workflows/android-arcore-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Reuse one development signing certificate across CI builds so the
      # OAuth package + SHA-1 registration does not change every run.
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: monument-android-debug-signing-v1
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Record debug APK signing certificate
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee android/app/build/outputs/apk/debug/signing-certificate.txt
      - name: Upload debug APK and signing certificate
        uses: actions/upload-artifact@v4
        with:
          name: monument-camera-passthrough-debug
          path: android/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7
